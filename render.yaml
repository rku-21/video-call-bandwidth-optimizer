services:
  - type: web
    name: avc-web
    runtime: node
    # Deploy everything as a single web service (backend serves frontend/dist)
    buildCommand: >
      cd backendTs && npm ci --include=dev && npm run build && cd .. &&
      cd frontend && npm ci --include=dev && npm run build
    startCommand: node backendTs/dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
