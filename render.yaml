services:
  - type: web
    name: avc-web
    runtime: node
    # Deploy everything as a single web service (backend serves frontend/dist)
    buildCommand: >
      npm ci --include=dev --prefix backendTs && npm run build --prefix backendTs &&
      npm ci --include=dev --prefix frontend && npm run build --prefix frontend
    startCommand: node backendTs/dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
